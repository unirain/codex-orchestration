<?xml version='1.0' encoding='utf-8'?>
<svg aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img">
  <style>text { font-family: 'Helvetica Neue', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }</style>
  <title id="title">后台重启后，哪些工作可以继续</title>
  <desc id="description">后台先取得仓库唯一实例锁，再按接单顺序检查每张 Ticket。本图展示单张 open Ticket 的恢复路径。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#526d91" stroke-width="1.4" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="1030" rx="0" fill="#ffffff" stroke="none" stroke-width="1.6" data-graph-role="background" />
  <text x="48" y="43" font-size="17" font-weight="650" text-anchor="start" fill="#2259b0">UML   /   活动图</text>
  <text x="1392" y="43" font-size="17" font-weight="500" text-anchor="end" fill="#46566c">Codex Orchestration   /   Spec v0.46</text>
  <text x="48" y="96" font-size="39" font-weight="650" text-anchor="start" fill="#172334">后台重启后，哪些工作可以继续</text>
  <text x="48" y="136" font-size="21" font-weight="400" text-anchor="start" fill="#46566c">后台先取得仓库唯一实例锁，再按接单顺序检查每张 Ticket。本图展示单张 open Ticket 的恢复路径。</text>
  <path d="M 48 970 L 1392 970" stroke="#b4c3d5" stroke-width="1" fill="none" stroke-linejoin="round" />
  <text x="48" y="1005" font-size="16" font-weight="500" text-anchor="start" fill="#46566c">规格依据   ·   FR-013   /   IR-002、008   /   DR-006   /   SEC-005   /   AC-035、046</text>
  <circle cx="697" cy="177" r="8" fill="#172334" />
  <path d="M 697 188 L 697 213" stroke="#526d91" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round" />
  <rect x="422.0" y="213" width="550" height="56" rx="17" fill="#eaf2ff" stroke="#b4c3d5" stroke-width="1.6" />
  <text x="697" y="248" font-size="21" font-weight="600" text-anchor="middle" fill="#172334">读取 Ticket、Assignment、暂停标记及待处理 Input</text>
  <path d="M 697 269 L 697 300" stroke="#526d91" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round" />
  <polygon points="697,300 724,320 697,340 670,320" fill="#fff5df" stroke="#526d91" stroke-width="1.8" />
  <path d="M 670 320 L 440 320" stroke="#526d91" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round" />
  <text x="555" y="308" font-size="17" font-weight="500" text-anchor="middle" fill="#46566c" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">[用户已暂停]</text>
  <rect x="56.0" y="292" width="384" height="56" rx="17" fill="#ffffff" stroke="#b4c3d5" stroke-width="1.6" />
  <text x="248" y="327" font-size="21" font-weight="600" text-anchor="middle" fill="#172334">维持暂停，等待明确继续</text>
  <path d="M 697 340 L 697 385" stroke="#526d91" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round" />
  <text x="697" y="369" font-size="17" font-weight="500" text-anchor="middle" fill="#46566c" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">[未暂停]</text>
  <polygon points="697,385 724,405 697,425 670,405" fill="#fff5df" stroke="#526d91" stroke-width="1.8" />
  <path d="M 670 405 L 440 405" stroke="#526d91" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round" />
  <text x="555" y="393" font-size="17" font-weight="500" text-anchor="middle" fill="#46566c" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">[尚未启动 · pending]</text>
  <rect x="56.0" y="377" width="384" height="56" rx="17" fill="#ffffff" stroke="#b4c3d5" stroke-width="1.6" />
  <text x="248" y="412" font-size="21" font-weight="600" text-anchor="middle" fill="#172334">原 Assignment 重新排队</text>
  <path d="M 724 405 L 939 405" stroke="#526d91" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round" />
  <text x="829" y="393" font-size="17" font-weight="500" text-anchor="middle" fill="#46566c" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">[等待、待评审、受阻或失败]</text>
  <rect x="939.0" y="365" width="432" height="80" rx="17" fill="#ffffff" stroke="#b4c3d5" stroke-width="1.6" />
  <text x="1155" y="397" font-size="21" font-weight="600" text-anchor="middle" fill="#172334">检查是否有合资格的新 Input</text>
  <text x="1155" y="425" font-size="17" font-weight="400" text-anchor="middle" fill="#46566c">有则按正常规则唤醒，否则维持现状</text>
  <path d="M 697 425 L 697 484" stroke="#526d91" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round" />
  <text x="697" y="461" font-size="17" font-weight="500" text-anchor="middle" fill="#46566c" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">[执行被中断且仍应推进]</text>
  <rect x="397.0" y="484" width="600" height="80" rx="17" fill="#eaf2ff" stroke="#b4c3d5" stroke-width="1.6" />
  <text x="697" y="516" font-size="21" font-weight="600" text-anchor="middle" fill="#172334">核对旧 turn、容器、Input 投递及在途远端写入</text>
  <text x="697" y="544" font-size="17" font-weight="400" text-anchor="middle" fill="#46566c">按工作目录、Git 提交、绑定 PR、Session 历史与回执对账</text>
  <path d="M 697 564 L 697 604" stroke="#526d91" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round" />
  <polygon points="697,604 724,624 697,644 670,624" fill="#fff5df" stroke="#526d91" stroke-width="1.8" />
  <path d="M 724 624 L 939 624" stroke="#526d91" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round" />
  <text x="830" y="611" font-size="17" font-weight="500" text-anchor="middle" fill="#46566c" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">[归属或结果无法核实]</text>
  <rect x="939.0" y="584" width="432" height="80" rx="17" fill="#ffffff" stroke="#b4c3d5" stroke-width="1.6" />
  <text x="1155" y="616" font-size="21" font-weight="600" text-anchor="middle" fill="#172334">保留现场并显示具体阻塞</text>
  <text x="1155" y="644" font-size="17" font-weight="400" text-anchor="middle" fill="#46566c">测试缺少结束证据时记为中断或未知</text>
  <path d="M 697 644 L 697 692" stroke="#526d91" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round" />
  <text x="697" y="674" font-size="17" font-weight="500" text-anchor="middle" fill="#46566c" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">[已核实]</text>
  <rect x="377.0" y="692" width="640" height="80" rx="17" fill="#eaf2ff" stroke="#b4c3d5" stroke-width="1.6" />
  <text x="697" y="724" font-size="21" font-weight="600" text-anchor="middle" fill="#172334">结束旧 Assignment，为原 Ticket 建立新 Assignment</text>
  <text x="697" y="752" font-size="17" font-weight="400" text-anchor="middle" fill="#46566c">复用 Worker Session、目录、分支和已绑定 PR；拒绝旧委派迟到的写入</text>
  <path d="M 697 772 L 697 829" stroke="#526d91" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round" />
  <rect x="352.0" y="829" width="690" height="80" rx="17" fill="#eaf6f0" stroke="#b4c3d5" stroke-width="1.6" />
  <text x="697" y="861" font-size="21" font-weight="600" text-anchor="middle" fill="#172334">按当前 Mandate、授权与槽位恢复</text>
  <text x="697" y="889" font-size="17" font-weight="400" text-anchor="middle" fill="#46566c">补交未接收的 Input；远端写入已生效则补记，确认未生效且获准才重试</text>
  <path d="M 697 909 L 697 918" stroke="#526d91" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round" />
  <circle cx="697" cy="931" r="12" fill="#ffffff" stroke="#172334" stroke-width="2" />
  <circle cx="697" cy="931" r="7" fill="#172334" />
</svg>