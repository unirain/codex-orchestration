  <text x="48" y="96" font-size="39" font-weight="650" text-anchor="start" fill="#172334">谁负责路由，谁有权执行</text>
  <text x="48" y="136" font-size="21" font-weight="400" text-anchor="start" fill="#46566c">一个仓库绑定一个常驻后台。终端可以退出，Engine、测试监听与 PR 轮询继续运行。</text>
